[package]
name = "xelma-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
rand = "0.8"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
testutils = ["soroban-sdk/testutils"]
legacy-map-settlement = []
