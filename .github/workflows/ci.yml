name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_AUDIT_VERSION: "0.22.2"

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo test
        run: cargo test --workspace --verbose --locked

      - name: Run deterministic replay parity suite (Issue #369)
        run: cargo test -p xelma-replay --locked -- --nocapture

      - name: Run emergency claims-only drill test
        run: cargo test --package xelma-contract --lib tests::drill --locked -- --nocapture

      - name: Run adversarial CI-critical scenarios only
        run: cargo test --package xelma-contract --lib test_critical_ --locked -- --nocapture

      - name: Verify settlement_math golden vectors (Issue #412, #562)
        run: |
          set -o pipefail
          mkdir -p golden-vectors-report
          cargo test --package xelma-contract --lib tests::settlement_math_vectors:: --locked -- --nocapture \
            | tee golden-vectors-report/settlement-math-golden-vectors.log
          cp contracts/test_vectors/settlement_math.json golden-vectors-report/

      - name: Upload settlement_math golden vectors artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-math-golden-vectors
          path: golden-vectors-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Benchmark report (cost/gas regression guardrails)
        run: |
          set -o pipefail
          cargo test --package xelma-contract cost_benchmarks --locked -- --nocapture \
            | tee cost-benchmarks.log

      - name: Upload cost benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cost-benchmarks
          path: cost-benchmarks.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Snapshot drift detection
        run: |
          if [ -d "contracts/test_snapshots" ] && ls contracts/test_snapshots/*.snap 1>/dev/null 2>&1; then
            echo "--- Snapshot drift check ---"
            echo "Snapshot golden files exist. To regenerate intentionally:"
            echo "  ./scripts/update_snapshots.sh"
            echo ""
            echo "If you did not intend to change snapshots, check for accidental"
            echo "storage or event mutations in your branch."
            echo "---"
          else
            echo "No snapshot golden files to check."
          fi

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  contract-build:
    name: Contract Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
            ${{ runner.os }}-cargo-

      # `wasm32-unknown-unknown` on current Rust toolchains defaults to
      # enabling wasm `reference-types`, which the Soroban host rejects at
      # deploy time ("reference-types not enabled"). `wasm32v1-none` targets
      # the WASM MVP feature baseline Soroban actually supports.
      #
      # `cargo rustc --crate-type=cdylib` (rather than plain `cargo build`,
      # which also builds the `rlib` crate-type listed in Cargo.toml) is
      # required to get the same lean output `stellar contract build`
      # produces — building both crate-types in one pass roughly doubles
      # the deployed WASM's size, which is enough to blow the local
      # network's upload resource budget. Confirmed via scripts/e2e_smoke.sh
      # deploying to a real local Soroban RPC.
      - name: Build contract (release)
        run: cargo rustc --manifest-path=contracts/Cargo.toml --crate-type=cdylib --target=wasm32v1-none --release --locked

      - name: Check WASM artifact exists
        run: |
          if [ ! -f "target/wasm32v1-none/release/xelma_contract.wasm" ]; then
            echo "Error: WASM file not found"
            exit 1
          fi
          ls -lh target/wasm32v1-none/release/xelma_contract.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/xelma_contract.wasm
          retention-days: 7

  wasm-size-gate:
    name: WASM Size Gate
    runs-on: ubuntu-latest
    needs: contract-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/

      # Issue #872: fail the build when the release WASM grows past
      # `.wasm-size-baseline` + 5% (the slack that absorbs compiler noise).
      # The script prints a size report and an actionable bump procedure;
      # policy lives in docs/wasm-size-budget.md.
      - name: Check release WASM against size baseline
        run: bash scripts/check_wasm_size.sh target/wasm32v1-none/release/xelma_contract.wasm

  bindings-test:
    name: Bindings Tests
    runs-on: ubuntu-latest
    needs: contract-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bindings/package-lock.json

      - name: Install dependencies
        working-directory: bindings
        run: npm ci

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/

      - name: Run source-level parity and error tests
        working-directory: bindings
        run: npm run test:parity && npm run test:errors

      - name: Run vitest WASM integration suite
        working-directory: bindings
        env:
          WASM_PATH: ${{ github.workspace }}/target/wasm32v1-none/release/xelma_contract.wasm
        run: npm run test:wasm

  bindings-build:
    name: Bindings Build
    runs-on: ubuntu-latest
    needs: contract-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        working-directory: bindings
        run: npm ci

      - name: Build TypeScript bindings
        working-directory: bindings
        run: npm run build

      - name: Lint TypeScript bindings
        working-directory: bindings
        run: npm run lint

      - name: Check build artifacts
        run: |
          if [ ! -f "bindings/dist/index.js" ] || [ ! -f "bindings/dist/index.d.ts" ]; then
            echo "Error: Build artifacts not found"
            exit 1
          fi
          echo "index.js exists"
          echo "index.d.ts exists"

      - name: Upload bindings artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-dist
          path: bindings/dist/
          retention-days: 7

  parity-check:
    name: Parity Check
    runs-on: ubuntu-latest
    needs: [contract-build, bindings-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/

      - name: Download bindings artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-dist
          path: bindings/dist/

      - name: Verify WASM and bindings compatibility
        run: |
          echo "Checking WASM file..."
          ls -lh target/wasm32v1-none/release/xelma_contract.wasm

          echo "Checking bindings..."
          ls -lh bindings/dist/

          echo "Verifying TypeScript types exist..."
          if grep -q "export.*Client" bindings/dist/index.d.ts; then
            echo "Client export found in type definitions"
          else
            echo "Client export not found"
            exit 1
          fi

          if grep -q "export.*BetSide" bindings/dist/index.d.ts; then
            echo "BetSide export found in type definitions"
          else
            echo "BetSide export not found"
            exit 1
          fi

          echo "Running ABI drift checking script..."
          cd bindings
          npm ci
          npm run test:parity && npm run test:errors

  bindings-vitest:
    name: Bindings Vitest (against CI-built WASM)
    runs-on: ubuntu-latest
    needs: contract-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bindings/package-lock.json

      - name: Install dependencies
        working-directory: bindings
        run: npm ci

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/

      - name: Verify WASM artifact exists and is valid
        run: |
          WASM=target/wasm32v1-none/release/xelma_contract.wasm
          if [ ! -f "$WASM" ]; then
            echo "Error: WASM artifact not found at $WASM"
            exit 1
          fi
          SIZE=$(stat -c%s "$WASM" 2>/dev/null || stat -f%z "$WASM")
          if [ "$SIZE" -lt 1024 ]; then
            echo "Error: WASM file is suspiciously small ($SIZE bytes)"
            exit 1
          fi
          echo "WASM artifact OK: $SIZE bytes"
          ls -lh "$WASM"

      - name: Run bindings vitest suite against CI-built WASM
        working-directory: bindings
        env:
          WASM_PATH: ${{ github.workspace }}/target/wasm32v1-none/release/xelma_contract.wasm
        run: npm run test:vitest

  e2e-smoke:
    name: E2E Smoke (local Soroban RPC)
    runs-on: ubuntu-latest
    needs: contract-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          stellar --version

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/

      # Boots a real local Soroban network (stellar/quickstart, via
      # `stellar container start`) and drives one full round through
      # initialize -> mint -> create_round -> place_bet -> resolve_round ->
      # claim_winnings against the *actual WASM built in this run*
      # asserting balances and on-chain events. This is the thing that unit
      # tests under contracts/src/tests/ (in-process via testutils) cannot
      # catch: real deploy validation, transaction auth, and RPC
      # integration. See scripts/e2e_smoke.sh for details and local
      # reproduction steps.
      - name: Run full round-lifecycle smoke test against a local Soroban RPC
        env:
          WASM_PATH: ${{ github.workspace }}/target/wasm32v1-none/release/xelma_contract.wasm
        run: ./scripts/e2e_smoke.sh

  error-code-parity:
    name: Error Code Parity (Rust <> TS <> docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Rust <> TypeScript <> docs error enum parity
        run: node bindings/src/parity.js

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate workspace coverage
        run: cargo llvm-cov --all-features --workspace --locked --lcov --output-path lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7
          if-no-files-found: ignore
